name: Validate market preview

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "prototypes/india-canada-market-preview/**"
      - "scripts/validate-market-preview.mjs"
      - ".github/workflows/market-preview-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "prototypes/india-canada-market-preview/**"
      - "scripts/validate-market-preview.mjs"
      - ".github/workflows/market-preview-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate prototype syntax and required interactions
        run: node scripts/validate-market-preview.mjs
